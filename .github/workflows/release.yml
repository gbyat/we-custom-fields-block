name: Release

on:
  push:
    tags:
      - "v*" # Trigger on version tags (e.g., v1.0.0)

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          git checkout ${{ github.ref }}

      - name: Setup PHP
        run: |
          sudo apt-get update
          sudo apt-get install -y php php-cli php-xml php-mbstring

      - name: Install PHP dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --no-interaction --prefer-dist
          fi

      - name: Run PHP Linter (phpcs)
        continue-on-error: true
        run: |
          # Check if phpcs is available
          if command -v phpcs &> /dev/null || [ -f vendor/bin/phpcs ]; then
            if [ -f vendor/bin/phpcs ]; then
              vendor/bin/phpcs --standard=WordPress --extensions=php we-custom-fields-block.php
            else
              phpcs --standard=WordPress --extensions=php we-custom-fields-block.php
            fi
          else
            echo "phpcs not found, skipping lint check"
          fi

      - name: Validate Plugin Header
        run: |
          php -r "
          \$header = file_get_contents('we-custom-fields-block.php');
          if (!preg_match('/Version:\s*[\d.]+/', \$header)) {
            echo 'ERROR: Version not found in plugin header\n';
            exit(1);
          }
          echo '✓ Plugin header valid\n';
          "

      - name: Validate CHANGELOG
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "ERROR: CHANGELOG.md not found"
            exit 1
          fi

          # Extract version from tag
          VERSION=${GITHUB_REF#refs/tags/v}

          if ! grep -q "## \[${VERSION}\]" CHANGELOG.md; then
            echo "ERROR: Version ${VERSION} not found in CHANGELOG.md"
            exit 1
          fi

          echo "✓ CHANGELOG.md contains version ${VERSION}"

  build:
    name: Build Release
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          git checkout ${{ github.ref }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Setup Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs

      - name: Install dependencies
        run: npm ci

      - name: Sync version
        run: npm run sync-version

      - name: Build plugin
        run: npm run build

      - name: Create plugin ZIP
        run: |
          PLUGIN_NAME="we-custom-fields-block"
          ZIP_NAME="${PLUGIN_NAME}.zip"

          # Create a temporary directory for the plugin
          mkdir -p ${PLUGIN_NAME}

          # Copy main plugin file
          cp we-custom-fields-block.php ${PLUGIN_NAME}/
          echo "✅ Copied we-custom-fields-block.php"

          # Copy build directory (block assets)
          if [ -d "build" ]; then
            cp -r build ${PLUGIN_NAME}/
            echo "✅ Copied build/ (block assets)"
          else
            echo "ERROR: build directory not found!"
            exit 1
          fi

          # Copy languages directory (translations)
          if [ -d "languages" ]; then
            cp -r languages ${PLUGIN_NAME}/
            echo "✅ Copied languages/ (translations)"
          fi

          # Copy documentation files
          for doc in README.md CHANGELOG.md; do
            if [ -f "$doc" ]; then
              cp "$doc" ${PLUGIN_NAME}/
              echo "✅ Copied $doc"
            fi
          done

          # Create ZIP file - always named we-custom-fields-block.zip
          zip -r ${ZIP_NAME} ${PLUGIN_NAME}/

          # Clean up temporary directory
          rm -rf ${PLUGIN_NAME}

          echo "✅ ZIP file created: ${ZIP_NAME}"
          ls -lh ${ZIP_NAME}

      - name: Setup GitHub CLI
        run: |
          type -p curl >/dev/null || sudo apt install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          gh auth setup-git
          gh release create ${GITHUB_REF#refs/tags/} \
            --title "Release ${VERSION}" \
            --notes-file CHANGELOG.md \
            we-custom-fields-block.zip
